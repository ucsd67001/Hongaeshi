<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本返し ― 読んだあとに、ありがとうを。</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   本返し ― 見た目
   GEMu_Web の作り（細い罫／角丸の板／英字の小さな札＋大きな見出し／
   数字のタイル／縁をめぐる灯り）を、そのままライトへ移したもの。
   夜の図書館 → 朝の書庫。
   ============================================================ */
:root{
  /* 地：ごく薄い紫。白に藤を一滴だけ落とした色 */
  --地:#f8f6fc;
  --地の奥:#f0ecf8;
  --面:#fffdff;
  --面の上:#faf8fd;
  --縁:rgba(74,60,104,.13);
  --縁の濃い:rgba(74,60,104,.28);

  /* 字：地 #f8f6fc に対して 14.8 / 6.1 / 4.7 : 1 */
  --字:#1d1a24;
  --字の薄い:#5b5468;
  --字のごく薄い:#7a7288;

  --灯:#6b4bc4;        /* 藤 */
  --灯の濃い:#54379f;
  --灯の淡い:#efe9fb;
  --水:#2f8f9c;        /* 差しの青緑 */
  --朱:#c2452d;        /* お金の色 */
  --朱の淡い:#fbeeeb;
  --緑:#3f7a56;

  --丸:14px;
  --丸の小:9px;

  --字体:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
  --影:0 1px 2px rgba(48,34,82,.045), 0 10px 30px rgba(48,34,82,.06);
  --くぼみ:#f4f1fb;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:var(--地);color:var(--字);
  font-family:var(--字体);font-size:15px;line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
input,textarea,select,button{font-family:var(--字体)}
button{cursor:pointer}

/* 朝の書庫の明かり。紫の側だけで作る */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 520px at 16% -10%, rgba(107,75,196,.11), transparent 62%),
    radial-gradient(760px 480px at 90% 2%, rgba(47,143,156,.055), transparent 60%),
    radial-gradient(1100px 700px at 50% 110%, rgba(129,92,214,.10), transparent 66%),
    linear-gradient(180deg, var(--地) 0%, var(--地の奥) 100%);
}
a{color:var(--灯の濃い);text-decoration:none}
a:hover{color:var(--字)}
::selection{background:rgba(107,75,196,.18)}

.枠{width:min(1060px,100% - 40px);margin-inline:auto}

/* ── 上の帯 ───────────────────────────────── */
.帯{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
  background:rgba(248,246,252,.84);border-bottom:1px solid var(--縁)}
.帯 .中{display:flex;align-items:center;gap:18px;height:62px}
.銘{font-size:19px;letter-spacing:.16em;white-space:nowrap;cursor:pointer;font-weight:600}
.銘 .粒{color:var(--灯);margin-right:9px;font-size:11px;vertical-align:2px}
.帯 nav{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.帯 nav button{font-size:12.5px;letter-spacing:.06em;color:var(--字の薄い);
  padding:6px 14px;border-radius:999px;border:1px solid transparent;background:none}
.帯 nav button:hover{color:var(--字);background:var(--面の上);border-color:var(--縁)}
.帯 nav button.いま{color:var(--灯の濃い);background:var(--灯の淡い);border-color:var(--縁の濃い)}
.デモ札{font-size:10px;letter-spacing:.22em;color:var(--字のごく薄い);
  border:1px solid var(--縁);border-radius:999px;padding:2px 10px}

/* ── 見出しのかたまり ──────────────────────────── */
.英字の札{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--灯);margin:0 0 14px}
h1.大見出し{font-size:clamp(28px,4.6vw,46px);line-height:1.4;font-weight:700;letter-spacing:.02em;margin:0 0 20px}
.導き{color:var(--字の薄い);font-size:15px;max-width:60ch;margin:0}
.幕{padding:58px 0 8px}
.節{padding:40px 0 0}
h2.節見出し{font-size:19px;font-weight:700;letter-spacing:.06em;margin:0 0 6px;display:flex;align-items:center;gap:10px}
h2.節見出し::before{content:"◆";color:var(--灯);font-size:10px}
.節の添え{color:var(--字のごく薄い);font-size:13px;margin:0 0 20px}

/* ── 板（カード）と、縁をめぐる灯り ───────────────── */
.板{background:var(--面);border:1px solid var(--縁);border-radius:var(--丸);padding:22px;box-shadow:var(--影)}
@property --めぐる角度{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes 縁をめぐる{to{--めぐる角度:360deg}}
.板,.めぐる{position:relative}
.板::after,.めぐる::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:conic-gradient(from var(--めぐる角度),
    transparent 0deg,transparent 236deg,
    rgba(107,75,196,.30) 284deg,var(--灯) 322deg,var(--水) 346deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none;
  animation:縁をめぐる 7s linear infinite;
}
.並び>*:nth-child(2)::after{animation-delay:-2.3s}
.並び>*:nth-child(3)::after{animation-delay:-4.6s}
.板.静か::after{display:none}
.並び{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

/* ── 数字のタイル ────────────────────────────── */
.数字たち{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:30px}
.数字{padding:16px 18px}
.数字 .名{font-size:11px;letter-spacing:.2em;color:var(--字のごく薄い);text-transform:uppercase}
.数字 .値{font-size:30px;font-weight:700;line-height:1.25;letter-spacing:.01em;margin-top:2px}
.数字 .添え{font-size:11.5px;color:var(--字のごく薄い);line-height:1.6}

/* ── ボタン ────────────────────────────────── */
.釦{background:var(--朱);color:#fff;border:none;border-radius:10px;padding:12px 24px;
  font-size:14px;font-weight:600;letter-spacing:.08em;transition:.16s;box-shadow:0 4px 14px rgba(194,69,45,.2)}
.釦:hover{background:#a63823;transform:translateY(-1px)}
.釦.藤{background:var(--灯);box-shadow:0 4px 14px rgba(107,75,196,.2)}
.釦.藤:hover{background:var(--灯の濃い)}
.釦.枠だけ{background:transparent;color:var(--字の薄い);border:1px solid var(--縁の濃い);box-shadow:none}
.釦.枠だけ:hover{background:var(--面の上);color:var(--字);transform:none}
.釦.全幅{display:block;width:100%}
.釦.小{padding:6px 14px;font-size:12px;letter-spacing:.04em}
.釦:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}

.札{display:inline-block;font-size:11px;letter-spacing:.06em;padding:2px 10px;border-radius:999px;
  border:1px solid var(--縁);background:var(--面の上);color:var(--字の薄い);line-height:1.8}
.札.注{background:var(--朱の淡い);border-color:rgba(194,69,45,.22);color:var(--朱)}
.札.済{background:#edf4f0;border-color:rgba(63,122,86,.2);color:var(--緑)}
.札.藤{background:var(--灯の淡い);border-color:var(--縁の濃い);color:var(--灯の濃い)}

/* ── さがす欄 ───────────────────────────────── */
.さがす{display:flex;gap:8px;max-width:520px;margin:28px 0 0}
.さがす input{flex:1;padding:13px 17px;border:1px solid var(--縁の濃い);border-radius:11px;
  background:var(--面);font-size:14.5px;color:var(--字)}
.さがす input:focus{outline:none;border-color:var(--灯);box-shadow:0 0 0 3px rgba(107,75,196,.12)}

/* ── 本の札 ────────────────────────────────── */
.本の列{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.本の札{display:flex;gap:14px;padding:15px;align-items:flex-start;text-align:left;width:100%;
  background:var(--面);border:1px solid var(--縁);border-radius:var(--丸);transition:.16s;box-shadow:var(--影)}
.本の札:hover{border-color:var(--縁の濃い);transform:translateY(-2px);box-shadow:0 2px 4px rgba(48,34,82,.055),0 14px 34px rgba(48,34,82,.10)}
.書影{width:54px;min-width:54px;height:77px;border-radius:2px 4px 4px 2px;position:relative;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:9.5px;color:#fff;padding:6px;line-height:1.4;overflow:hidden;
  box-shadow:1px 2px 5px rgba(48,34,82,.24)}
.書影::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(90deg,rgba(0,0,0,.28),transparent)}
.書影.大{width:104px;min-width:104px;height:150px;font-size:13px;padding:12px}
.本の名{font-size:14.5px;font-weight:600;line-height:1.55}
.本の素性{font-size:12px;color:var(--字のごく薄い);margin-top:4px;line-height:1.6}
.本の数{font-size:12px;color:var(--字の薄い);margin-top:8px}
.本の数 b{color:var(--朱);font-size:14px;font-weight:700}

/* ── 本のページ ───────────────────────────── */
.本の頭{display:flex;gap:24px;padding:26px;align-items:flex-start;margin-top:26px}
.受取の行{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--縁)}
.受取の行:last-child{border-bottom:none}
.顔{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:var(--灯の淡い);color:var(--灯の濃い);flex:none}
.声{padding:15px 18px;border-bottom:1px solid var(--縁)}
.声:last-child{border-bottom:none}
.声 .素性{font-size:11.5px;color:var(--字のごく薄い);margin-bottom:5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.声 .金{color:var(--朱);font-weight:700;font-size:12.5px}
.声 p{margin:0;font-size:14px;line-height:1.85}

/* ── 覆い（モーダル） ─────────────────────────── */
.覆い{position:fixed;inset:0;background:rgba(42,32,66,.34);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.窓{background:var(--面);border-radius:18px;max-width:476px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:0 30px 80px rgba(42,32,66,.3);border:1px solid var(--縁)}
.窓の頭{padding:20px 24px 0;display:flex;align-items:center;gap:10px}
.窓の頭 h3{font-size:17px;flex:1;margin:0;letter-spacing:.06em;font-weight:600}
.閉じる{background:none;border:none;font-size:20px;color:var(--字のごく薄い);line-height:1;padding:4px 6px}
.窓の中{padding:16px 24px 24px}
.段{display:flex;gap:6px;padding:14px 24px 0}
.段 div{height:3px;flex:1;background:var(--縁);border-radius:2px;transition:.2s}
.段 div.いま{background:var(--灯)}

.金額たち{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.金額たち button{padding:15px 4px;border:1px solid var(--縁);background:var(--面の上);border-radius:11px;
  font-size:17px;font-weight:600;color:var(--字);letter-spacing:.02em;transition:.14s}
.金額たち button:hover{border-color:var(--縁の濃い)}
.金額たち button.いま{border-color:var(--朱);background:var(--朱の淡い);color:var(--朱)}
.欄{width:100%;padding:11px 14px;border:1px solid var(--縁の濃い);border-radius:10px;
  font-size:14px;background:var(--面の上);color:var(--字)}
.欄:focus{outline:none;border-color:var(--灯);box-shadow:0 0 0 3px rgba(107,75,196,.12)}
textarea.欄{min-height:94px;resize:vertical;line-height:1.85}
.名札{display:block;font-size:12px;letter-spacing:.08em;color:var(--字の薄い);margin:18px 0 7px;font-weight:600}

.配る{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--縁)}
.配る:last-of-type{border-bottom:none}
.配る .名{flex:1;font-size:13px;line-height:1.5}
.配る input[type=range]{width:100px;accent-color:var(--灯)}
.配る .率{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}

.内訳{background:var(--くぼみ);border:1px solid var(--縁);border-radius:12px;padding:15px 17px;margin-top:15px;font-size:13px}
.内訳 .行{display:flex;justify-content:space-between;padding:4px 0;gap:12px}
.内訳 .行.締め{border-top:1px dashed var(--縁の濃い);margin-top:8px;padding-top:10px;font-weight:700}
.帯グラフ{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 13px;background:var(--縁)}

.断り{background:#fdf7ec;border:1px solid #ecdcba;border-radius:11px;padding:13px 15px;
  font-size:12.5px;color:#7a5a24;line-height:1.85}
.断り.藤{background:var(--灯の淡い);border-color:var(--縁の濃い);color:var(--灯の濃い)}
.終い{text-align:center;padding:16px 0 4px}
.終い .印{font-size:46px;line-height:1}

/* ── 表 ──────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--縁)}
tr:last-child td{border-bottom:none}
th{font-size:11px;letter-spacing:.14em;color:var(--字のごく薄い);font-weight:600;text-transform:uppercase}
td.右,th.右{text-align:right;font-variant-numeric:tabular-nums}
.表の板{overflow:hidden;padding:0}

/* ── しくみ ───────────────────────────────── */
.流れ{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-top:6px}
.流れ .板{padding:18px}
.流れ .番{font-size:11px;letter-spacing:.24em;color:var(--灯)}
.流れ h4{margin:6px 0 6px;font-size:15px;font-weight:600;letter-spacing:.04em}
.流れ p{margin:0;font-size:12.5px;color:var(--字の薄い);line-height:1.8}

/* ── 裾 ──────────────────────────────────── */
.裾{margin:64px 0 34px;padding-top:22px;border-top:1px solid var(--縁);
  font-size:12px;color:var(--字のごく薄い);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.裾 button{background:none;border:none;color:var(--字のごく薄い);text-decoration:underline;font-size:12px;padding:0}

@media(max-width:620px){
  .本の頭{flex-direction:column}
  .金額たち{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
  .板::after,.めぐる::after{animation:none}
  *{transition:none !important}
}
</style>
</head>

<div class="帯"><div class="枠 中">

</div></div>

<main id="app" class="枠"></main>

</div></div>

function 読む(){
  try{ const r=localStorage.getItem("hongaeshi_v1"); if(r) return JSON.parse(r); }catch(e){}
  return { 返し:[], 残し:[] };
}

const 本 = id => 蔵書.find(b=>b.id===id);
const 認証済 = b => b.受取.filter(r=>r.認証);
function 集計(b){
  const 私 = 状態.返し.filter(t=>t.本===b.id);
  const 残 = 状態.残し.filter(k=>k.本===b.id);
  return {
    人数: b.元数 + b.声.filter(v=>v.額>0).length + 私.length,
    金額: b.元額 + b.声.reduce((s,v)=>s+v.額,0) + 私.reduce((s,t)=>s+t.額,0),
    声数: b.声.length + 私.filter(t=>t.文).length + 残.filter(k=>k.文).length,
    残数: (b.元残||0) + 残.length,
    約額: (b.元約||0) + b.声.reduce((s,v)=>s+(v.約||0),0) + 残.reduce((s,k)=>s+(k.約||0),0),
    私
  };
}
const 総額 = () => 蔵書.reduce((s,b)=>s+集計(b).金額,0);
const 総人 = () => 蔵書.reduce((s,b)=>s+集計(b).人数,0);
const 総受取 = () => 蔵書.reduce((s,b)=>s+認証済(b).length,0);

const 逃 = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   覆い：本返しする

let F = {};
function 返し始め(id){
  const b = 本(id), 受 = 認証済(b);
  F = {本:id, 段:1, 額:既定額, 自由:"", 文:"", 匿:false,
       配分:Object.fromEntries(受.map((r,i,a)=>[r.id, Math.floor(100/a.length)+(i===0?100%a.length:0)]))};
  返し描く();
}
function 覆い閉じ(){ document.getElementById("窓").innerHTML=""; }
function 額指定(v){ F.額=v; F.自由=""; 返し描く(); }
function 額自由(v){ F.自由=v; const n=parseInt(v.replace(/[^0-9]/g,""),10); F.額=isNaN(n)?0:n; 返し描く(true); }
function 配分変更(id,v){ F.配分[id]=+v; 返し描く(); }
function 均等(){ const k=Object.keys(F.配分); k.forEach((x,i)=>F.配分[x]=Math.floor(100/k.length)+(i===0?100%k.length:0)); 返し描く(); }
const 配分計 = () => Object.values(F.配分).reduce((a,b)=>a+b,0);
function 段へ(n){ F.段=n; 返し描く(); }

function 返し描く(自由に){
  const b = 本(F.本), 受 = 認証済(b);
  const 額 = F.額||0;
  const 決 = Math.round(額*決済率), 運 = Math.round(額*運営率), 本へ = 額-決-運;
  let 中 = "";

  if(F.段===1){
    中 = `
      <p style="margin:0 0 2px;font-size:13px;color:var(--字の薄い)">「${b.題}」に、いくら返しますか。</p>
      <div class="金額たち">
        ${[100,300,500,1000,3000,5000].map(v=>
          `<button class="${!F.自由&&F.額===v?'いま':''}" onclick="額指定(${v})">¥${v.toLocaleString()}</button>`).join("")}
      </div>
      <input class="欄" id="自由額" inputmode="numeric" placeholder="自由な額（¥100〜¥50,000）"
        value="${逃(F.自由)}" oninput="額自由(this.value)">
      <div class="内訳">
        <div class="帯グラフ">
          <div style="width:${額?本へ/額*100:0}%;background:var(--朱)"></div>
          <div style="width:${額?決/額*100:0}%;background:#c9c0d4"></div>
          <div style="width:${額?運/額*100:0}%;background:var(--灯)"></div>
        </div>
        <div class="行"><span>本の世界へ届く分</span><b style="color:var(--朱)">${円(本へ)}</b></div>
        <div class="行"><span style="color:var(--字のごく薄い)">決済手数料（実費ぶん・約5%）</span><span style="color:var(--字のごく薄い)">${円(決)}</span></div>
        <div class="行"><span style="color:var(--字のごく薄い)">本返しの運営（5%）</span><span style="color:var(--字のごく薄い)">${円(運)}</span></div>
        <div class="行 締め"><span>お支払い</span><span>${円(額)}</span></div>
      </div>
      ${額>0&&額<300?`<p style="font-size:11.5px;color:var(--字のごく薄い);margin:9px 0 0;line-height:1.7">
        ※ 少額は決済の固定費が重くなるため、実装では数件をまとめて決済する方式を想定しています。</p>`:""}
      <button class="釦 全幅" style="margin-top:17px" ${額<100||額>50000?"disabled":""} onclick="段へ(2)">届け先をえらぶ</button>`;
  }

  if(F.段===2){
    const 計 = 配分計();
    中 = `
      <p style="margin:0 0 8px;font-size:13px;color:var(--字の薄い)">${円(本へ)} を、誰に届けますか。</p>
      ${受.map(r=>`<div class="配る">
        <div class="名"><b>${r.名}</b><br><span style="font-size:11.5px;color:var(--字のごく薄い)">${r.種}</span></div>
        <input type="range" min="0" max="100" step="5" value="${F.配分[r.id]}" oninput="配分変更('${r.id}',this.value)">
        <div class="率">${F.配分[r.id]}%</div>
        <div class="率" style="width:58px;color:var(--朱)">${円(本へ*F.配分[r.id]/100)}</div>
      </div>`).join("")}
      <div style="display:flex;align-items:center;gap:11px;margin-top:13px">
        <button class="釦 枠だけ 小" onclick="均等()">均等にする</button>
        <span style="font-size:12.5px;${計===100?'color:var(--字のごく薄い)':'color:var(--朱);font-weight:700'}">
          合計 ${計}%${計===100?"":" ― 100%にしてください"}</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:20px">
        <button class="釦 枠だけ" onclick="段へ(1)">戻る</button>
        <button class="釦" style="flex:1" ${計===100?"":"disabled"} onclick="段へ(3)">ことばを添える</button>
      </div>`;
  }

  if(F.段===3){
    中 = `
      <p style="margin:0 0 2px;font-size:13px;color:var(--字の薄い)">この本に伝えたいことを。（任意・本のページに公開されます）</p>
      <textarea class="欄" style="margin-top:9px" placeholder="例）高校生の頃に読んで、進路を決めました。"
        oninput="F.文=this.value">${逃(F.文)}</textarea>
      <label class="名札" style="display:flex;align-items:center;gap:9px;font-weight:400;margin-top:12px">
        <input type="checkbox" ${F.匿?"checked":""} onchange="F.匿=this.checked"> 匿名で届ける
      </label>
      <div class="内訳">
        <div class="行"><span>お支払い</span><b>${円(額)}</b></div>
        ${受.filter(r=>F.配分[r.id]>0).map(r=>
          `<div class="行"><span style="color:var(--字のごく薄い)">${r.名}</span><span>${円(本へ*F.配分[r.id]/100)}</span></div>`).join("")}
        <div class="行"><span style="color:var(--字のごく薄い)">決済＋運営</span><span style="color:var(--字のごく薄い)">${円(決+運)}</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:17px">
        <button class="釦 枠だけ" onclick="段へ(2)">戻る</button>
        <button class="釦" style="flex:1" onclick="返し確定()">本返しする</button>
      </div>
      <p style="font-size:11.5px;color:var(--字のごく薄い);text-align:center;margin:11px 0 0">
        デモのため、実際の決済は行われません</p>`;
  }

  if(F.段===4){
    中 = `<div class="終い">
      <div class="印">🕊</div>
      <h3 style="font-size:20px;margin:10px 0 6px;font-weight:700;letter-spacing:.06em">本返し、届きました</h3>
      <p style="font-size:13px;color:var(--字の薄い);margin:0">
        『${b.題}』へ ${円(額)}<br><span style="color:var(--朱);font-weight:600">${円(本へ)}</span> が本の世界へ渡ります</p>
      <button class="釦 全幅" style="margin-top:20px" onclick="覆い閉じ();描く()">本のページへ戻る</button>
      <button class="釦 枠だけ 全幅" style="margin-top:8px" onclick="覆い閉じ();go('dash')">受取人の控えを見る</button>
    </div>`;
  }

  document.getElementById("窓").innerHTML = `
  <div class="覆い" onclick="if(event.target===this)覆い閉じ()">
    <div class="窓 めぐる">
      <div class="窓の頭"><h3>${F.段===4?"":"この本に本返しする"}</h3>
        <button class="閉じる" onclick="覆い閉じ()">×</button></div>
      ${F.段<4?`<div class="段">${[1,2,3].map(i=>`<div class="${F.段>=i?'いま':''}"></div>`).join("")}</div>`:""}
      <div class="窓の中">${中}</div>
    </div></div>`;

  if(自由に){ const t=document.getElementById("自由額");
    if(t&&F.段===1){t.focus();t.setSelectionRange(t.value.length,t.value.length);} }
}

function 返し確定(){
  状態.返し.push({本:F.本, 額:F.額, 文:F.文, 配分:{...F.配分}, 匿:F.匿, 時:Date.now()});
  書く(); 段へ(4);
}

/* ============================================================
   頁：受取人の控え
   ============================================================ */
function 頁_受取人(){
  const 誰 = "岩波書店";
  const 入金 = [];
  蔵書.forEach(b=>{
    const r = b.受取.find(x=>x.名===誰 && x.認証);
    if(!r) return;
    const 割 = 認証済(b).length;
    b.声.forEach(v=>{ if(v.額>0) 入金.push({b,名:v.名,額:Math.round(v.額*.9/割),文:v.文,日:v.日}); });
    状態.返し.filter(t=>t.本===b.id).forEach(t=>{
      const p = (t.配分&&t.配分[r.id])||0;
      if(p>0) 入金.push({b,名:t.匿?"匿名":"読者",額:Math.round(t.額*.9*p/100),文:t.文,日:0});
    });
  });
  const 合計 = 入金.reduce((s,i)=>s+i.額,0);
  const 声あり = 入金.filter(i=>i.文);

  return `
  <section class="幕" style="padding-bottom:0">
    <p class="英字の札">Receiver</p>
    <h1 class="大見出し" style="font-size:clamp(24px,3.4vw,34px)">受取人の控え</h1>
    <p class="導き">${誰}（認証済）として見ています。<span class="札 藤">デモ用の切り替え</span></p>
    <div class="数字たち">
      <div class="板 数字"><div class="名">This month</div><div class="値" style="color:var(--朱)">${円(合計)}</div><div class="添え">受取予定額</div></div>
      <div class="板 数字"><div class="名">Thanks</div><div class="値">${入金.length}</div><div class="添え">届いた本返し</div></div>
      <div class="板 数字"><div class="名">Voices</div><div class="値">${声あり.length}</div><div class="添え">読者の声</div></div>
    </div>
  </section>

  <section class="節">
    <h2 class="節見出し">明細</h2>
    <p class="節の添え">支払額の90%が、配分に応じて渡ります</p>
    <div class="板 静か 表の板"><table>
      <tr><th>本</th><th>読者</th><th class="右">受取額</th><th>いつ</th></tr>
      ${入金.length ? 入金.map(i=>`<tr><td>${i.b.題}</td><td>${逃(i.名)}</td>
        <td class="右">${円(i.額)}</td>
        <td style="color:var(--字のごく薄い);font-size:12.5px">${i.日===0?"たった今":i.日+"日前"}</td></tr>`).join("")
      : '<tr><td colspan="4" style="color:var(--字のごく薄い);font-size:13px">まだ受取はありません。</td></tr>'}
    </table></div>
  </section>

  <section class="節">
    <h2 class="節見出し">読者の声</h2>
    <p class="節の添え">購買データでは決して取れない、読後の感情</p>
    <div class="板 静か" style="padding:0">
      ${声あり.length ? 声あり.map(i=>`<div class="声">
        <div class="素性"><b style="color:var(--字の薄い)">${i.b.題}</b>
          <span class="金">${円(i.額)}</span>
          <span>${i.日===0?"たった今":i.日+"日前"}</span></div>
        <p>${逃(i.文)}</p></div>`).join("")
      : '<div class="声" style="color:var(--字のごく薄い);font-size:13px">まだありません。</div>'}
    </div>
    <div class="断り 藤" style="margin-top:16px">
      <b>この画面が、本返しのいちばんの資産です。</b>
      「1,000人が復刊希望を押した」より、「1,000人が合計72万円出してでも残したいと言っている」のほうが、
      出版社にとって意思決定できるしるしになります。</div>
  </section>`;
}
