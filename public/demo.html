<!-- ============================================================
     デモ ― 本体の画面（app.js・共通.js・style.css）を**そのまま**動かす（2026-09-27 決定 A）

     ⚠️⚠️ 画面をここに書かないこと。前のデモは画面を別に持っていて、本体から2日でずれた。
        違うのは次の3つだけ：
          1. 下の import map で、Firebase を public/デモ/Firebaseの代わり.js に付け替える
             （データは public/デモ/ダミーデータ.js の架空の棚。操作は見ている人のブラウザにだけ残る）
          2. window.本返しの頭 = "/demo"（app.js が行き先に付けて、/demo の下に留める）
          3. 帯と裾の文言、上の「デモです」の帯
     ⚠️ index.html の器（帯・main・裾・窓）を変えたら、ここも合わせる。
     ⚠️ 共通.js の Firebase の版（10.14.1）を上げたら、下の5つの URL も合わせる。
     ============================================================ -->
<script>window.本返しの頭 = "/demo";</script>
<script type="importmap">
{
  "imports": {
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js":       "/デモ/Firebaseの代わり.js",
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js":      "/デモ/Firebaseの代わり.js",
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js": "/デモ/Firebaseの代わり.js",
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js":   "/デモ/Firebaseの代わり.js",
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js": "/デモ/Firebaseの代わり.js"
  }
}
</script>
<style>
/* デモの帯。本体の色（style.css の :root）をそのまま使う */

  <a href="/">本物の本返しへ</a>
</div></div>
